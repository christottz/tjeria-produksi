<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tjeria Produksi - Manajemen Keuangan Usaha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <div class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- HEADER APLIKASI -->
    <div class="bg-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4 border-l-8 border-emerald-500">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Tjeria Produksi</h1>
        <p class="text-sm text-slate-500 mt-1">Pencatatan Keuangan Keripik & Es Mambo</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="syncData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow">
          <i class="fa-solid fa-rotate"></i>
          <span>Sinkronkan Sekarang</span>
        </button>
      </div>
    </div>

    <!-- FILTER LINI USAHA -->
    <div class="flex border-b border-slate-300 bg-white rounded-t-xl overflow-hidden shadow-sm">
      <button onclick="filterBusiness('Semua')" id="btn-Semua" class="flex-1 py-3 text-center font-bold text-sm bg-emerald-600 text-white">Semua Lini Usaha</button>
      <button onclick="filterBusiness('Keripik')" id="btn-Keripik" class="flex-1 py-3 text-center font-bold text-sm text-slate-600 hover:bg-slate-50">Keripik</button>
      <button onclick="filterBusiness('Es Mambo')" id="btn-Es Mambo" class="flex-1 py-3 text-center font-bold text-sm text-slate-600 hover:bg-slate-50">Es Mambo</button>
    </div>

    <!-- DASHBOARD RINGKASAN -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center text-slate-500 mb-1">
          <span class="text-xs font-semibold uppercase">Total Penjualan</span>
          <i class="fa-solid fa-arrow-down-left text-emerald-500"></i>
        </div>
        <div id="totalPemasukan" class="text-2xl font-black text-emerald-600">Rp 0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center text-slate-500 mb-1">
          <span class="text-xs font-semibold uppercase">Total Pengeluaran</span>
          <i class="fa-solid fa-arrow-up-right text-rose-500"></i>
        </div>
        <div id="totalPengeluaran" class="text-2xl font-black text-rose-600">Rp 0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center text-slate-500 mb-1">
          <span class="text-xs font-semibold uppercase">Keuntungan Bersih</span>
          <i class="fa-solid fa-wallet text-blue-500"></i>
        </div>
        <div id="totalLaba" class="text-2xl font-black text-blue-600">Rp 0</div>
      </div>
    </div>

    <!-- FORM INPUT TRANSAKSI -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
        Tambah Transaksi Baru
      </h3>
      <form id="transactionForm" onsubmit="addTransaction(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="tanggal" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Lini Usaha</label>
          <select id="liniUsaha" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Keripik">Keripik</option>
            <option value="Es Mambo">Es Mambo</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Transaksi</label>
          <select id="jenis" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Pemasukan">Penjualan (Pemasukan)</option>
            <option value="Pengeluaran">Belanja / Operasional (Pengeluaran)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
          <select id="kategori" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Penjualan Produk">Penjualan Produk</option>
            <option
